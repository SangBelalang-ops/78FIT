<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=JetBrains+Mono:wght@700&family=Montserrat:wght@600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: url('https://i.postimg.cc/WbdvM7Nj/Gemini-Generated-Image-lsl1eflsl1eflsl1-clean-(1).png') center/cover no-repeat; font-family: 'Montserrat', sans-serif; color: white; }
        
        .header-title { font-family: 'Bangers'; font-size: 3rem; color: #ffeb3b; text-shadow: 0 5px 15px rgba(0,0,0,0.5); animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }

        .timer-container { display: flex; gap: 15px; margin: 30px 0; }
        .box { background: rgba(0,0,0,0.3); backdrop-filter: blur(10px); padding: 15px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); width: 70px; text-align: center; }
        .time-val { font-family: 'JetBrains Mono'; font-size: 1.8rem; color: #00ffcc; }

        /* Radial Menu Style */
        .interaction-area { position: fixed; bottom: 40px; left: 40px; display: flex; align-items: center; justify-content: center; width: 100px; height: 100px; }
        
        .main-btn { width: 80px; cursor: pointer; transition: 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 100; }
        .main-btn.active { transform: rotate(180deg); }

        .sub-icon { 
            position: absolute; width: 60px; cursor: pointer; 
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0; transform: scale(0); z-index: 5;
        }
        .sub-icon.show { opacity: 1; transform: scale(1); }
        
        /* Posisi Melingkar (Radial) */
        .sub-icon:nth-child(2) { top: -80px; left: 10px; } 
        .sub-icon:nth-child(3) { top: -40px; left: 80px; }
        .sub-icon:nth-child(4) { top: 30px; left: 80px; }

        #res { margin-top: 20px; font-size: 1.5rem; color: #ffeb3b; font-family: 'JetBrains Mono'; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header-title">Countdown Menuju Bebas!</div>
    <div class="timer-container">
        <div class="box"><div id="days" class="time-val">00</div><small>HARI</small></div>
        <div class="box"><div id="hours" class="time-val">00</div><small>JAM</small></div>
        <div class="box"><div id="minutes" class="time-val">00</div><small>MENIT</small></div>
        <div class="box"><div id="seconds" class="time-val">00</div><small>DETIK</small></div>
    </div>

    <div class="interaction-area">
        <img src="https://i.postimg.cc/nLWF8wcg/image-removebg-preview.png" class="main-btn" onclick="toggleRadial()">
        
        <img src="https://cdn-icons-png.flaticon.com/512/1006/1006771.png" class="sub-icon" onclick="show('LILAS')">
        <img src="https://cdn-icons-png.flaticon.com/512/2933/2933103.png" class="sub-icon" onclick="show('HOLD')">
        <img src="https://cdn-icons-png.flaticon.com/512/2875/2875418.png" class="sub-icon" onclick="show('DLL')">
    </div>
    
    <div id="res"></div>

    <script>
        const webAppUrl = 'https://script.google.com/macros/s/AKfycbwPO97YPOU40Uhug6m0HdRgsJgJ7-jMnRUw7uY4wjqOOBhANiEMRRN4jn6txya3T2915w/exec';
        let db = {};

        function fetchData() {
            const script = document.createElement('script');
            script.src = webAppUrl + '?callback=processData';
            document.body.appendChild(script);
        }

        window.processData = function(data) {
            data.forEach(row => { if (row[0] && row[0] !== "STAFF") db[row[0].toString().toUpperCase().trim()] = row[1]; });
        }

        function toggleRadial() {
            document.querySelector('.main-btn').classList.toggle('active');
            document.querySelectorAll('.sub-icon').forEach(icon => icon.classList.toggle('show'));
        }

        function show(name) {
            let val = db[name.toUpperCase()];
            let display = val ? "Rp " + val.toString().replace(/[^\d]/g, '').replace(/\B(?=(\d{3})+(?!\d))/g, ".") : "Kosong";
            document.getElementById("res").innerText = name + ": " + display;
        }

        function updateTimer() {
            const diff = new Date("August 29, 2026 00:00:00") - new Date();
            document.getElementById("days").innerText = Math.floor(diff / (1000*60*60*24));
            document.getElementById("hours").innerText = Math.floor((diff % (1000*60*60*24)) / (1000*60*60)).toString().padStart(2, '0');
            document.getElementById("minutes").innerText = Math.floor((diff % (1000*60*60)) / (1000*60)).toString().padStart(2, '0');
            document.getElementById("seconds").innerText = Math.floor((diff % (1000*60)) / 1000).toString().padStart(2, '0');
        }
        
        fetchData();
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
