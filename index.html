<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=JetBrains+Mono:wght@700&family=Montserrat:wght@600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: url('https://i.postimg.cc/WbdvM7Nj/Gemini-Generated-Image-lsl1eflsl1eflsl1-clean-(1).png') center/cover no-repeat; font-family: 'Montserrat', sans-serif; color: white; overflow: hidden; }
        
        /* Animasi Pesawat */
        .plane { position: fixed; z-index: 1; pointer-events: none; width: 60px; }
        .p1 { top: 15%; animation: flyRight 25s linear infinite; }
        .p2 { top: 30%; animation: flyLeft 20s linear infinite; }
        @keyframes flyRight { 0% { left: -200px; } 100% { left: 110%; } }
        @keyframes flyLeft { 0% { left: 110%; transform: scaleX(-1); } 100% { left: -200px; transform: scaleX(-1); } }
        
        .header-title { font-family: 'Bangers'; font-size: 3rem; color: #ffeb3b; text-shadow: 0 5px 15px rgba(0,0,0,0.5); margin-bottom: 30px; }

        .timer-container { display: flex; gap: 15px; margin-bottom: 50px; }
        .box { background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); padding: 15px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); width: 70px; text-align: center; }
        .time-val { font-family: 'JetBrains Mono'; font-size: 1.8rem; color: #00ffcc; }

        /* Menu Samping Paspor */
        .interaction-area { display: flex; align-items: center; gap: 20px; }
        #passport-btn { width: 90px; cursor: pointer; transition: 0.3s; z-index: 100; }
        #passport-btn:hover { transform: scale(1.1); }
        
        .bubble-group { display: flex; flex-direction: column; gap: 10px; }
        .bubble { background: rgba(255,255,255,0.2); border: 1px solid white; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; opacity: 0; transform: translateX(-20px); transition: 0.4s; pointer-events: none; }
        .bubble.show { opacity: 1; transform: translateX(0); pointer-events: auto; }
        .bubble:hover { background: #ffeb3b; color: black; }
        
        #res { margin-top: 30px; font-size: 1.8rem; color: #ffeb3b; font-family: 'JetBrains Mono'; font-weight: bold; min-height: 40px; }
    </style>
</head>
<body>

    <img src="https://cdn-icons-png.flaticon.com/512/201/201623.png" class="plane p1">
    <img src="https://cdn-icons-png.flaticon.com/512/201/201623.png" class="plane p2">

    <div class="header-title">Countdown Menuju Bebas!</div>
    
    <div class="timer-container">
        <div class="box"><div id="days" class="time-val">00</div><small>HARI</small></div>
        <div class="box"><div id="hours" class="time-val">00</div><small>JAM</small></div>
        <div class="box"><div id="minutes" class="time-val">00</div><small>MENIT</small></div>
        <div class="box"><div id="seconds" class="time-val">00</div><small>DETIK</small></div>
    </div>

    <div class="interaction-area">
        <div class="bubble-group">
            <div id="bubble1" class="bubble" onclick="show('LILAS')">LILAS</div>
            <div id="bubble2" class="bubble" onclick="show('ANJAS')">ANJAS</div>
        </div>
        <img src="https://i.postimg.cc/nLWF8wcg/image-removebg-preview.png" id="passport-btn" onclick="toggleBubbles()">
    </div>
    
    <div id="res"></div>

    <script>
        const webAppUrl = 'https://script.google.com/macros/s/AKfycbwPO97YPOU40Uhug6m0HdRgsJgJ7-jMnRUw7uY4wjqOOBhANiEMRRN4jn6txya3T2915w/exec';
        let db = {}, lastClicked = "";

        function fetchData() {
            const script = document.createElement('script');
            script.src = webAppUrl + '?callback=processData';
            document.body.appendChild(script);
        }

        window.processData = function(data) {
            data.forEach(row => { if (row[0] && row[0] !== "STAFF") db[row[0].toString().toUpperCase().trim()] = row[1]; });
        }

        function toggleBubbles() {
            document.querySelectorAll('.bubble').forEach(b => b.classList.toggle('show'));
        }

        function show(name) {
            let res = document.getElementById("res");
            if (lastClicked === name) {
                res.innerText = "";
                lastClicked = "";
            } else {
                let val = db[name.toUpperCase()];
                let display = val ? "Rp " + val.toString().replace(/[^\d]/g, '').replace(/\B(?=(\d{3})+(?!\d))/g, ".") : "Kosong";
                res.innerText = name + ": " + display;
                lastClicked = name;
            }
        }

        function updateTimer() {
            const diff = new Date("August 29, 2026 00:00:00") - new Date();
            document.getElementById("days").innerText = Math.floor(diff / (1000*60*60*24));
            document.getElementById("hours").innerText = Math.floor((diff % (1000*60*60*24)) / (1000*60*60)).toString().padStart(2, '0');
            document.getElementById("minutes").innerText = Math.floor((diff % (1000*60*60)) / (1000*60)).toString().padStart(2, '0');
            document.getElementById("seconds").innerText = Math.floor((diff % (1000*60)) / 1000).toString().padStart(2, '0');
        }
        
        fetchData();
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
