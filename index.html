<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #000; color: #0f0; font-family: 'Courier New', monospace; text-align: center; padding-top: 50px; }
    .box { border: 2px solid #0f0; padding: 30px; border-radius: 15px; display: inline-block; }
    h1 { color: #fff; }
    #data { font-size: 1.5em; color: #ff0; margin-bottom: 20px; }
    #timer { font-size: 1.2em; color: #0f0; }
  </style>
</head>
<body>

<div class="box">
  <h1>TERMINAL STATUS</h1>
  <div id="data">Sedang mengambil data...</div>
  <div id="timer">Countdown: menghitung...</div>
</div>

<script>
  // Ganti link di bawah ini dengan LINK WEB APP (exec) lo yang baru
  const url = 'https://script.google.com/macros/s/AKfycbz0zLW0C749WRAY4cFGlQvYg4V2QxqUbq0VHfsjJdfB/dev';

  fetch(url)
    .then(r => r.json())
    .then(res => {
      // Menampilkan data
      document.getElementById('data').innerHTML = `
        <p>LILAS: Rp ${res.lilas.toLocaleString()}</p>
        <p>ANJAS: Rp ${res.anjas.toLocaleString()}</p>
      `;
    })
    .catch(err => {
      document.getElementById('data').innerHTML = "ERROR: Gagal tarik data. Cek Deployment!";
      console.error(err);
    });

  // Countdown
  const targetDate = new Date("Dec 31, 2026 23:59:59").getTime();
  setInterval(() => {
    const now = new Date().getTime();
    const diff = targetDate - now;
    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
    document.getElementById('timer').innerHTML = `Sisa waktu: ${d} hari lagi`;
  }, 1000);
</script>

</body>
</html>
