<div class="financial-box" style="margin: 20px 0; color: #ffd700; font-weight: 900;">
    <div>LILAS: Rp <span id="val-lilas">0</span></div>
    <div>ANJAS: Rp <span id="val-anjas">0</span></div>
    <div id="countdown" style="margin-top:10px; color: #fff;"></div>
</div>

<script>
    function handleData(d) {
        // Tampilkan Uang Kas
        document.getElementById('val-lilas').innerText = d.LILAS.toLocaleString();
        document.getElementById('val-anjas').innerText = d.ANJAS.toLocaleString();
        
        // Update Stok (fungsi lama lo)
        snackData.forEach(s => { 
            if(d[s.name.toUpperCase()] !== undefined) s.stock = parseInt(d[s.name.toUpperCase()]); 
        });
        render();
    }

    // Countdown Timer (bisa taruh di bawah handleData)
    setInterval(() => {
        const target = new Date("Dec 31, 2026 23:59:59").getTime();
        const now = new Date().getTime();
        const diff = target - now;
        const d = Math.floor(diff / (1000 * 60 * 60 * 24));
        document.getElementById('countdown').innerText = `WINTER ENDS IN: ${d} DAYS`;
    }, 1000);
</script>
