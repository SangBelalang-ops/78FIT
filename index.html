<!DOCTYPE html>
<html lang="id">
<head>
    <style>
        /* Menggunakan visual latar belakang nuansa Kamboja & Indonesia */
        body {
            margin: 0; padding: 0;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                        url('https://images.unsplash.com/photo-1549448358-757755038077?q=80&w=2000'); /* Nuansa Candi/Kamboja */
            background-size: cover;
            background-position: center;
            font-family: 'Poppins', sans-serif;
            color: #ffffff; display: flex; justify-content: center;
            align-items: center; height: 100vh; overflow: hidden;
        }

        /* Container dengan efek Glassmorphism */
        .container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            padding: 50px; border-radius: 30px;
            text-align: center; border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            width: 350px;
        }

        .timer { font-size: 2.5rem; font-weight: 700; color: #ffce00; margin: 20px 0; }
        
        select { 
            padding: 12px; border-radius: 10px; border: none; 
            width: 100%; background: #ffffff; font-weight: bold; cursor: pointer;
        }

        .amount { font-size: 1.5rem; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Sisa Kontrak Kerja</h2>
        <div id="timer" class="timer">00d 00h 00m 00s</div>
        
        <select id="userSelect" onchange="showBalance()">
            <option value="">-- Pilih Nama --</option>
            <option value="LILAS">LILAS</option>
            <option value="ANJAS">ANJAS</option>
        </select>
        
        <div class="amount" id="saldo">Rp 0</div>
    </div>

    <script>
        const db = { "LILAS": "46.500.000", "ANJAS": "50.375.000" };

        function updateTimer() {
            const target = new Date("August 29, 2026 00:00:00").getTime();
            const now = new Date().getTime();
            const diff = target - now;

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById("timer").innerHTML = `${d}d ${h}h ${m}m ${s}s`;
        }

        function showBalance() {
            const name = document.getElementById("userSelect").value;
            document.getElementById("saldo").innerText = name ? "Rp " + db[name] : "Rp 0";
        }

        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
