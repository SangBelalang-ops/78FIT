<div class="card" style="border-left: 3px solid #00f2ff; box-shadow: 0 0 15px rgba(0, 242, 255, 0.15);">
    <h3>STATUS HOLD COMM RULES</h3>
    
    <div id="hold-data-container">
        <p style="text-align: center; color: #7a8a9e;">Memuat data dari Spreadsheet...</p>
    </div>
</div>

<script>
    // GANTI LINK INI dengan link CSV dari "Publish to Web" Anda
    const sheetCsvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS_g7zOlv0uGZ_M_p_Mh_Your_Published_ID/pub?gid=0&single=true&output=csv";

    async function fetchSheetData() {
        try {
            const response = await fetch(sheetCsvUrl);
            const data = await response.text();
            
            // Parsing CSV sederhana
            const rows = data.split('\n').map(row => row.split(','));
            
            /* Asumsi berdasarkan permintaan Anda (A22:B24):
               Row 21 (Index 21) = A22 & B22 (LILAS)
               Row 22 (Index 22) = A23 & B23 (ANJAS)
            */
            
            const lilasLabel = rows[21][0]; // Kolom A22
            const lilasVal = rows[21][1];   // Kolom B22
            const anjasLabel = rows[22][0]; // Kolom A23
            const anjasVal = rows[22][1];   // Kolom B23

            const container = document.getElementById('hold-data-container');
            container.innerHTML = `
                <div class="item" style="justify-content: space-between; font-family: 'Chakra Petch', sans-serif; letter-spacing: 1px;">
                    <div>
                        <span style="color: #00f2ff; font-weight: 700; font-size: 1.1rem;">${lilasLabel}</span>
                        <small style="display: block; color: #7a8a9e; font-size: 0.7rem;">S&K RULES A22:B22</small>
                    </div>
                    <span style="color: #00ff88; font-weight: 700; font-size: 1.2rem; text-shadow: 0 0 10px rgba(0,255,136,0.3);">${formatNumber(lilasVal)}</span>
                </div>
                
                <div class="item" style="justify-content: space-between; font-family: 'Chakra Petch', sans-serif; letter-spacing: 1px; margin-top: 15px; border-top: 1px solid #1a2636; padding-top: 15px; margin-bottom: 0;">
                    <div>
                        <span style="color: #e01e37; font-weight: 700; font-size: 1.1rem;">${anjasLabel}</span>
                        <small style="display: block; color: #7a8a9e; font-size: 0.7rem;">S&K RULES A23:B23</small>
                    </div>
                    <span style="color: #00ff88; font-weight: 700; font-size: 1.2rem; text-shadow: 0 0 10px rgba(0,255,136,0.3);">${formatNumber(anjasVal)}</span>
                </div>
            `;
        } catch (error) {
            console.error("Gagal memuat data:", error);
            document.getElementById('hold-data-container').innerHTML = "<p style='color: #e01e37;'>Gagal sinkronisasi data.</p>";
        }
    }

    function formatNumber(num) {
        if(!num) return "0";
        // Menghilangkan karakter non-angka dan memformat ke ribuan
        const cleanNum = num.replace(/[^0-9]/g, '');
        return new Intl.NumberFormat('id-ID').format(cleanNum);
    }

    // Panggil fungsi saat web dibuka
    window.addEventListener('load', () => {
        initRoadmap();
        initParticles();
        animateParticles();
        fetchSheetData(); 
    });

    // Kode Countdown dan Particles tetap sama seperti sebelumnya...
</script>
