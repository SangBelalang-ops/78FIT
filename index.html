<!DOCTYPE html>
<html lang="id">
<head>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: url('https://i.postimg.cc/WbdvM7Nj/Gemini-Generated-Image-lsl1eflsl1eflsl1-clean-(1).png') center/cover; }
        
        /* Container Clock */
        .flip-container { display: flex; gap: 15px; }
        .card { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(8px); padding: 15px; border-radius: 8px; text-align: center; color: white; width: 70px; }
        .number { font-size: 2rem; font-weight: 800; }

        /* Menu Paspor */
        #passport-icon { position: absolute; bottom: 30px; left: 30px; width: 60px; cursor: pointer; transition: 0.3s; }
        #menu-panel { display: none; position: absolute; bottom: 100px; left: 30px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 10px; color: white; }
        .name-btn { background: #444; border: none; color: white; padding: 10px; margin: 5px; cursor: pointer; border-radius: 5px; }
        .name-btn:hover { background: #666; }
    </style>
</head>
<body>

    <!-- Countdown -->
    <div class="flip-container">
        <div class="card"><div class="number" id="days">00</div></div>
        <div class="card"><div class="number" id="hours">00</div></div>
        <div class="card"><div class="number" id="minutes">00</div></div>
    </div>

    <!-- Ikon Paspor -->
    <https://i.postimg.cc/nLWF8wcg/image-removebg-preview.png" id="passport-icon" onclick="toggleMenu()">

    <!-- Menu Panel -->
    <div id="menu-panel">
        <button class="name-btn" onclick="showBalance('LILAS')">LILAS</button>
        <button class="name-btn" onclick="showBalance('ANJAS')">ANJAS</button>
        <div id="result" style="margin-top:10px; font-weight:bold;"></div>
    </div>

    <script>
        const db = { "LILAS": "Rp 46.500.000", "ANJAS": "Rp 50.375.000" };

        function toggleMenu() {
            const panel = document.getElementById("menu-panel");
            panel.style.display = (panel.style.display === "block") ? "none" : "block";
        }

        function showBalance(name) {
            document.getElementById("result").innerText = name + ": " + db[name];
        }

        // Countdown Logic (Tetap jalan)
        function updateTimer() {
            const diff = new Date("August 29, 2026 00:00:00").getTime() - new Date().getTime();
            document.getElementById("days").innerText = Math.floor(diff / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
            document.getElementById("hours").innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
            document.getElementById("minutes").innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
        }
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
