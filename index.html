<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: url('https://i.postimg.cc/WbdvM7Nj/Gemini-Generated-Image-lsl1eflsl1eflsl1-clean-(1).png') center/cover no-repeat; font-family: 'Montserrat', sans-serif; color: white; }
        .header-title { position: absolute; top: 10%; font-size: 2rem; letter-spacing: 4px; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        .timer-container { display: flex; gap: 20px; }
        .box { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); padding: 20px; border-radius: 20px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.3); }
        .time-val { font-size: 2.5rem; font-weight: 800; min-width: 80px; }
        .label { font-size: 0.7rem; text-transform: uppercase; margin-bottom: 10px; font-weight: bold; color: #ffeb3b; }
        #passport-btn { position: fixed; bottom: 30px; left: 30px; width: 90px; cursor: pointer; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #passport-btn:hover { transform: scale(1.2) rotate(-15deg); }
        .bubble { position: fixed; display: none; left: 140px; background: rgba(255,255,255,0.9); color: #333; padding: 15px 25px; border-radius: 50px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.3); animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
        .bubble:hover { transform: scale(1.1); background: #ffeb3b; }
    </style>
</head>
<body>

    <div class="header-title">SISA HARI KEMERDEKAAN DUNIA NYATA</div>
    <div class="timer-container">
        <div class="box"><div class="label">HARI</div><div id="days" class="time-val">00</div></div>
        <div class="box"><div class="label">JAM</div><div id="hours" class="time-val">00</div></div>
        <div class="box"><div class="label">MENIT</div><div id="minutes" class="time-val">00</div></div>
        <div class="box"><div class="label">DETIK</div><div id="seconds" class="time-val">00</div></div>
    </div>

    <img src="https://i.postimg.cc/nLWF8wcg/image-removebg-preview.png" id="passport-btn" onclick="toggleBubbles()">
    <div id="bubble1" class="bubble" style="bottom: 120px;" onclick="show('LILAS')">LILAS</div>
    <div id="bubble2" class="bubble" style="bottom: 50px;" onclick="show('ANJAS')">ANJAS</div>
    <div id="res" style="position:fixed; bottom:20px; right:30px; font-size:1.5rem; font-weight:bold; color:#ffeb3b; text-shadow: 2px 2px 5px #000;"></div>

    <script>
    // MASUKKAN LINK WEB APP KAMU DI SINI
    const webAppUrl = 'https://script.google.com/macros/s/AKfycbx5NBDydh8pLayh-u8r9dkbJozXOb-4QEO7IND4NYx_-YrI1NHdYudwyvRu2qnI6ri_2w/exec';
    let db = {};
    let lastClicked = "";

    async function fetchData() {
        try {
            const response = await fetch(webAppUrl);
            const data = await response.json(); 
            
            // Mencari di mana baris "STAFF" berada (baris dinamis)
            let startIndex = -1;
            data.forEach((row, index) => {
                if (row[0] === "STAFF") startIndex = index;
            });

            // Jika ketemu kata "STAFF", mulai ambil data di bawahnya
            if (startIndex !== -1) {
                for (let i = startIndex + 1; i < data.length; i++) {
                    const name = data[i][0] ? data[i][0].toString().toUpperCase().trim() : "";
                    const val = data[i][1] ? data[i][1].toString().trim() : "";
                    if (name !== "") {
                        db[name] = val;
                    }
                }
            }
            console.log("Database berhasil dimuat:", db);
        } catch (e) { console.error("Gagal tarik data:", e); }
    }

    function toggleBubbles() {
        const b1 = document.getElementById("bubble1");
        const b2 = document.getElementById("bubble2");
        b1.style.display = (b1.style.display === "block") ? "none" : "block";
        b2.style.display = (b2.style.display === "block") ? "none" : "block";
        if(b1.style.display === "none") { document.getElementById("res").innerText = ""; lastClicked = ""; }
    }

    function show(name) {
        const res = document.getElementById("res");
        const cleanName = name.toUpperCase().trim();
        
        if (lastClicked === name) { 
            res.innerText = ""; 
            lastClicked = ""; 
        } else { 
            // Mengambil dari database yang baru saja dimuat
            res.innerText = name + ": " + (db[cleanName] || "Data Kosong"); 
            lastClicked = name; 
        }
    }

    fetchData();
    
        function updateTimer() {
            const diff = new Date("August 29, 2026 00:00:00").getTime() - new Date().getTime();
            document.getElementById("days").innerText = Math.floor(diff / (1000*60*60*24));
            document.getElementById("hours").innerText = Math.floor((diff % (1000*60*60*24)) / (1000*60*60)).toString().padStart(2, '0');
            document.getElementById("minutes").innerText = Math.floor((diff % (1000*60*60)) / (1000*60)).toString().padStart(2, '0');
            document.getElementById("seconds").innerText = Math.floor((diff % (1000*60)) / 1000).toString().padStart(2, '0');
        }
        
        fetchData();
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
