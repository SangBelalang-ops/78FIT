<!DOCTYPE html>
<html lang="id">
<head>
    <style>
        /* Background kamu sudah siap, jadi di sini kita buat transparan */
        body {
            margin: 0; display: flex; justify-content: center; align-items: center;
            height: 100vh; font-family: sans-serif;
            background: url('https://i.postimg.cc/WbdvM7Nj/Gemini-Generated-Image-lsl1eflsl1eflsl1-clean-(1).png') center/cover;
        }

        .flip-container { display: flex; gap: 20px; }

        /* Kotak Transparan ala Flip Clock */
        .card {
            background: rgba(255, 255, 255, 0.2); /* Transparansi */
            backdrop-filter: blur(10px); /* Efek blur kaca */
            padding: 20px 15px; border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center; color: white; width: 80px;
        }

        .number { font-size: 3rem; font-weight: bold; }
        .label { font-size: 0.7rem; text-transform: uppercase; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="flip-container">
        <div class="card"><div class="number" id="days">00</div><div class="label">Days</div></div>
        <div class="card"><div class="number" id="hours">00</div><div class="label">Hours</div></div>
        <div class="card"><div class="number" id="minutes">00</div><div class="label">Minutes</div></div>
    </div>

    <script>
        function updateTimer() {
            const target = new Date("August 29, 2026 00:00:00").getTime();
            const now = new Date().getTime();
            const diff = target - now;

            document.getElementById("days").innerText = Math.floor(diff / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
            document.getElementById("hours").innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
            document.getElementById("minutes").innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
        }
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
