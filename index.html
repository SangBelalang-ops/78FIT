<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <style>
        body { 
            margin: 0; height: 100vh; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; 
            background: url('https://i.postimg.cc/WbdvM7Nj/Gemini-Generated-Image-lsl1eflsl1eflsl1-clean-(1).png') center/cover no-repeat;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Countdown Style */
        .timer-container { display: flex; gap: 15px; margin-bottom: 50px; }
        .box { 
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px);
            padding: 25px; border-radius: 15px; color: white;
            font-size: 3rem; font-weight: 800; min-width: 70px; text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-variant-numeric: tabular-nums;
        }
        .label { font-size: 0.6rem; text-transform: uppercase; margin-top: 5px; opacity: 0.7; }

        /* Paspor Icon */
        #passport-btn { 
            position: fixed; bottom: 30px; left: 30px; 
            width: 90px; cursor: pointer; transition: 0.3s;
        }
        #passport-btn:hover { transform: rotate(-10deg) scale(1.1); }

        /* Panel Menu */
        #menu-panel { 
            display: none; position: fixed; bottom: 130px; left: 30px; 
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            padding: 15px; border-radius: 12px; color: white; border: 1px solid #444;
        }
        .btn { padding: 8px 15px; cursor: pointer; border-radius: 5px; border: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="timer-container">
        <div class="box"><div id="days">00</div><div class="label">Days</div></div>
        <div class="box"><div id="hours">00</div><div class="label">Hours</div></div>
        <div class="box"><div id="minutes">00</div><div class="label">Minutes</div></div>
        <div class="box"><div id="seconds">00</div><div class="label">Seconds</div></div>
    </div>

    <img src="https://i.postimg.cc/nLWF8wcg/image-removebg-preview.png" id="passport-btn" onclick="toggleMenu()">

    <div id="menu-panel">
        <button class="btn" onclick="show('LILAS')">LILAS</button>
        <button class="btn" onclick="show('ANJAS')">ANJAS</button>
        <div id="res" style="margin-top:10px; font-size:1.2rem; color:#ffeb3b;"></div>
    </div>

    <script>
        const data = { "LILAS": "Rp 46.500.000", "ANJAS": "Rp 50.375.000" };

        function updateTimer() {
            const diff = new Date("August 29, 2026 00:00:00").getTime() - new Date().getTime();
            document.getElementById("days").innerText = Math.floor(diff / (1000*60*60*24)).toString().padStart(2, '0');
            document.getElementById("hours").innerText = Math.floor((diff % (1000*60*60*24)) / (1000*60*60)).toString().padStart(2, '0');
            document.getElementById("minutes").innerText = Math.floor((diff % (1000*60*60)) / (1000*60)).toString().padStart(2, '0');
            document.getElementById("seconds").innerText = Math.floor((diff % (1000*60)) / 1000).toString().padStart(2, '0');
        }

        function toggleMenu() { 
            const p = document.getElementById("menu-panel");
            p.style.display = (p.style.display === "block") ? "none" : "block"; 
        }

        function show(name) { document.getElementById("res").innerText = name + ": " + data[name]; }

        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
