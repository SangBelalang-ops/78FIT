<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Kontrak & Tabungan</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: white; text-align: center; padding: 50px; }
        .card { background: #2d2d2d; padding: 30px; border-radius: 15px; display: inline-block; width: 300px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { font-size: 2em; color: #00ffcc; }
        select { padding: 10px; border-radius: 5px; width: 100%; margin-bottom: 20px; }
        .amount { font-size: 1.5em; font-weight: bold; color: #ffcc00; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Countdown Kontrak</h2>
        <h1 id="countdown">Loading...</h1>
        
        <hr>
        
        <h3>Cek Tabungan</h3>
        <select id="userSelect" onchange="showData()">
            <option value="">Pilih Nama...</option>
            <option value="LILAS">LILAS</option>
            <option value="ANJAS">ANJAS</option>
        </select>
        <p>Saldo Anda:</p>
        <div id="saldo" class="amount">Rp 0</div>
    </div>

    <script>
        // Data Tabungan
        const data = {
            "LILAS": "Rp 46.500.000",
            "ANJAS": "Rp 50.375.000"
        };

        // Fungsi Countdown ke 29 Agustus 2026
        function updateCountdown() {
            const targetDate = new Date("August 29, 2026 00:00:00").getTime();
            const now = new Date().getTime();
            const diff = targetDate - now;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById("countdown").innerText = days + " Hari Lagi";
        }

        // Fungsi Tampil Saldo
        function showData() {
            const name = document.getElementById("userSelect").value;
            document.getElementById("saldo").innerText = data[name] || "Rp 0";
        }

        updateCountdown();
    </script>
</body>
</html>
