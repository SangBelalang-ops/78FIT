<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #000; color: #0f0; font-family: monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .box { border: 1px solid #0f0; padding: 20px; border-radius: 10px; text-align: center; width: 300px; }
  </style>
</head>
<body>
  <div class="box">
    <h3>DATA TERMINAL</h3>
    <div id="data">Memuat...</div>
  </div>
  <script>
    google.script.run.withSuccessHandler(res => {
      document.getElementById('data').innerHTML = `
        <p>LILAS: ${res.lilas.toLocaleString()}</p>
        <p>ANJAS: ${res.anjas.toLocaleString()}</p>
      `;
    }).getDataTabungan();
  </script>
</body>
</html>
