<!DOCTYPE html>
<html lang="id">
<head>
    <style>
        /* Background & Layout */
        body {
            margin: 0; padding: 0;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            background-image: url('https://www.transparenttextures.com/patterns/cubes.png');
            font-family: 'Segoe UI', sans-serif;
            color: white; display: flex; justify-content: center;
            align-items: center; height: 100vh; overflow: hidden;
        }

        /* Animasi Paspor */
        .passport {
            position: absolute; width: 60px;
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

        /* Container Utama */
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 40px; border-radius: 25px;
            text-align: center; border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 10;
        }

        /* Countdown Style */
        .timer { font-size: 3rem; font-weight: 800; letter-spacing: 2px; color: #ffeb3b; text-shadow: 0 0 10px rgba(255,235,59,0.5); }

        select { padding: 10px 20px; border-radius: 20px; border: none; margin: 20px 0; font-size: 1rem; }
    </style>
</head>
<body>

    <!-- Elemen Paspor -->
    <img src="https://cdn-icons-png.flaticon.com/512/3203/3203926.png" class="passport" style="top: 10%; left: 10%;">
    <img src="https://cdn-icons-png.flaticon.com/512/3203/3203926.png" class="passport" style="bottom: 10%; right: 10%;">

    <div class="container">
        <h2>JOURNEY TO FREEDOM</h2>
        <div id="timer" class="timer">00d 00h 00m 00s</div>
        
        <select id="userSelect" onchange="showBalance()">
            <option value="">-- Pilih Staff --</option>
            <option value="LILAS">LILAS</option>
            <option value="ANJAS">ANJAS</option>
        </select>
        <h2 id="saldo">Rp 0</h2>
    </div>

    <script>
        const db = { "LILAS": "46.500.000", "ANJAS": "50.375.000" };

        function updateTimer() {
            const target = new Date("August 29, 2026 00:00:00").getTime();
            const now = new Date().getTime();
            const diff = target - now;

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById("timer").innerHTML = `${d}d ${h}h ${m}m ${s}s`;
        }

        function showBalance() {
            const name = document.getElementById("userSelect").value;
            document.getElementById("saldo").innerText = name ? "Rp " + db[name] : "Rp 0";
        }

        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
