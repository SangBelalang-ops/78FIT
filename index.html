<!DOCTYPE html>
<html lang="id">
<head>
    <style>
        body {
            margin: 0; display: flex; justify-content: center; align-items: center;
            height: 100vh; font-family: 'Segoe UI', sans-serif;
            /* Ganti URL di bawah dengan link background kamu */
            background: url('https://i.postimg.cc/WbdvM7Nj/Gemini-Generated-Image-lsl1eflsl1eflsl1-clean-(1).png') center/cover no-repeat;
        }

        .flip-container { display: flex; gap: 15px; }

        .card {
            background: rgba(255, 255, 255, 0.15); /* Transparan */
            backdrop-filter: blur(8px);
            padding: 15px 10px; border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center; color: white; width: 70px;
        }

        .number { font-size: 2.5rem; font-weight: 800; font-variant-numeric: tabular-nums; }
        .label { font-size: 0.6rem; text-transform: uppercase; margin-top: 5px; opacity: 0.8; }
    </style>
</head>
<body>

    <div class="flip-container">
        <div class="card"><div class="number" id="days">00</div><div class="label">Days</div></div>
        <div class="card"><div class="number" id="hours">00</div><div class="label">Hours</div></div>
        <div class="card"><div class="number" id="minutes">00</div><div class="label">Minutes</div></div>
        <div class="card"><div class="number" id="seconds">00</div><div class="label">Seconds</div></div>
    </div>

    <script>
        function updateTimer() {
            const target = new Date("August 29, 2026 00:00:00").getTime();
            const now = new Date().getTime();
            const diff = target - now;

            // Hitung sisa waktu
            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);

            // Update ke layar
            document.getElementById("days").innerText = d.toString().padStart(2, '0');
            document.getElementById("hours").innerText = h.toString().padStart(2, '0');
            document.getElementById("minutes").innerText = m.toString().padStart(2, '0');
            document.getElementById("seconds").innerText = s.toString().padStart(2, '0');
        }

        // Jalankan tiap 1000ms (1 detik)
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
