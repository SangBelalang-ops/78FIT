<!DOCTYPE html>
<html>
<head>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { background: #0f172a; color: white; font-family: 'Inter', sans-serif; text-align: center; padding: 20px; margin: 0; }
    .container { max-width: 500px; margin: auto; }
    h1 { font-weight: 900; letter-spacing: -1px; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 25px; }
    .box { background: #1e293b; padding: 15px 5px; border-radius: 12px; border: 1px solid #334155; }
    .num { display: block; font-size: 1.5rem; font-weight: 800; color: #38bdf8; }
    .lab { font-size: 0.6rem; text-transform: uppercase; color: #94a3b8; }
    .card { background: #1e293b; border-radius: 20px; padding: 25px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .row { display: flex; justify-content: space-between; margin-bottom: 12px; padding-bottom: 12px; }
    .row:first-child { border-bottom: 1px solid #334155; }
    .name { color: #94a3b8; font-weight: 600; font-size: 0.9rem; }
    .val { font-weight: 700; color: #10b981; font-size: 1.1rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>The Final Countdown</h1>
    <p style="color:#64748b; margin-bottom:30px; font-size: 0.8rem;">Target: 29 Agustus 2026 • 20:00 WIB</p>

    <div class="grid">
      <div class="box"><span class="num" id="d">00</span><span class="lab">Hari</span></div>
      <div class="box"><span class="num" id="h">00</span><span class="lab">Jam</span></div>
      <div class="box"><span class="num" id="m">00</span><span class="lab">Menit</span></div>
      <div class="box"><span class="num" id="s">00</span><span class="lab">Detik</span></div>
    </div>

    <div class="card">
      <div class="row">
        <span class="name">LILAS | SEPT '24</span>
        <span class="val" id="lilas">Rp 0</span>
      </div>
      <div class="row" style="margin-bottom: 0; padding-bottom: 0;">
        <span class="name">ANJAS | SEPT '24</span>
        <span class="val" id="anjas">Rp 0</span>
      </div>
    </div>
  </div>

  <script>
    const target = new Date('August 29, 2026 20:00:00').getTime();
    setInterval(() => {
      const diff = target - new Date().getTime();
      if (diff > 0) {
        document.getElementById('d').innerText = Math.floor(diff / 86400000);
        document.getElementById('h').innerText = Math.floor((diff % 86400000) / 3600000);
        document.getElementById('m').innerText = Math.floor((diff % 3600000) / 60000);
        document.getElementById('s').innerText = Math.floor((diff % 60000) / 1000);
      }
    }, 1000);

    function loadData() {
      google.script.run.withSuccessHandler(res => {
        const fmt = n => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(n);
        document.getElementById('lilas').innerText = fmt(res.lilas);
        document.getElementById('anjas').innerText = fmt(res.anjas);
      }).getDataTabungan();
    }
    
    loadData();
    setInterval(loadData, 60000); 
  </script>
</body>
</html>
