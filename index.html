<script>
    // Link Web App yang baru
    const webAppUrl = 'https://script.google.com/macros/s/AKfycbwPO97YPOU40Uhug6m0HdRgsJgJ7-jMnRUw7uY4wjqOOBhANiEMRRN4jn6txya3T2915w/exec';
    let db = {};
    let lastClicked = "";

    // Fungsi pemanggil data (JSONP)
    function fetchData() {
        const script = document.createElement('script');
        script.src = webAppUrl + '?callback=processData';
        document.body.appendChild(script);
    }

    // Fungsi untuk memproses data yang diterima dari Google
    function processData(data) {
        let startIndex = -1;
        // Mencari posisi baris "STAFF"
        data.forEach((row, index) => {
            if (row[0] === "STAFF") startIndex = index;
        });

        if (startIndex !== -1) {
            for (let i = startIndex + 1; i < data.length; i++) {
                const name = data[i][0] ? data[i][0].toString().toUpperCase().trim() : "";
                const val = data[i][1] ? data[i][1].toString().trim() : "";
                if (name !== "") {
                    db[name] = val;
                }
            }
        }
        console.log("Database berhasil dimuat:", db);
    }

    function toggleBubbles() {
        const b1 = document.getElementById("bubble1");
        const b2 = document.getElementById("bubble2");
        b1.style.display = (b1.style.display === "block") ? "none" : "block";
        b2.style.display = (b2.style.display === "block") ? "none" : "block";
        if(b1.style.display === "none") { document.getElementById("res").innerText = ""; lastClicked = ""; }
    }

    function show(name) {
        const res = document.getElementById("res");
        const cleanName = name.toUpperCase().trim();
        if (lastClicked === name) { 
            res.innerText = ""; 
            lastClicked = ""; 
        } else { 
            res.innerText = name + ": " + (db[cleanName] || "Data Kosong"); 
            lastClicked = name; 
        }
    }

    function updateTimer() {
        const diff = new Date("August 29, 2026 00:00:00").getTime() - new Date().getTime();
        document.getElementById("days").innerText = Math.floor(diff / (1000*60*60*24));
        document.getElementById("hours").innerText = Math.floor((diff % (1000*60*60*24)) / (1000*60*60)).toString().padStart(2, '0');
        document.getElementById("minutes").innerText = Math.floor((diff % (1000*60*60)) / (1000*60)).toString().padStart(2, '0');
        document.getElementById("seconds").innerText = Math.floor((diff % (1000*60)) / 1000).toString().padStart(2, '0');
    }
    
    fetchData();
    setInterval(updateTimer, 1000);
    updateTimer();
</script>
